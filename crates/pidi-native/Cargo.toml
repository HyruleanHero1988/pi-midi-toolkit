[package]
name = "pidi-native"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native KAOSS/drum vertical-slice UI for the Pi TFT70"

[[bin]]
name = "pidi-native"
path = "src/main.rs"

[features]
default = ["sdl"]
sdl = ["dep:sdl2", "dep:glow"]

[dependencies]
jambox-protocol = { workspace = true }
jambox-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sdl2 = { version = "0.37", optional = true, default-features = false, features = ["use-pkgconfig"] }
glow = { version = "0.16", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }
