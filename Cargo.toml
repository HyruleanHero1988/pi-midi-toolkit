[workspace]
resolver = "2"
members = [
    "crates/midi-core",
    "crates/midi-engine",
]
default-members = [
    "crates/midi-core",
    "crates/midi-engine",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
midi-core = { path = "crates/midi-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
midir = "0.10"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
arc-swap = "1"
libc = "0.2"
