# Autologin into the Openbox midi-tone session (no Pi desktop shell).
# NOTE: /etc/lightdm/lightdm.conf is also patched by install-kiosk.sh because
# LightDM loads the main conf AFTER conf.d/, so drop-ins alone lose to
# raspi-config's autologin-session=LXDE-pi-x.
[Seat:*]
autologin-user=REPLACE_USER
autologin-user-timeout=0
user-session=midi-tone-kiosk
autologin-session=midi-tone-kiosk
