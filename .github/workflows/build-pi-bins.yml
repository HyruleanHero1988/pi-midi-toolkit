name: Build Pi armv7 bins

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deploy/build-pi-bins.sh"
      - "deploy/ubuntu-armhf-ports.sh"
      - ".github/workflows/build-pi-bins.yml"
  push:
    branches:
      - master
      - cursor/native-jambox-vertical-slice-010c
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deploy/build-pi-bins.sh"
      - "deploy/ubuntu-armhf-ports.sh"
      - ".github/workflows/build-pi-bins.yml"

# Bin commits use [skip ci] and do not match the path filters above
# (dist/armv7 is omitted on purpose) so they cannot loop this workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    # Ubuntu 22.04 ships glibc 2.35 — older than Pi Bookworm 2.36, so binaries run.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install armhf cross toolchain + SDL/ALSA
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture armhf
          # archive.ubuntu.com has no armhf; pin those sources to amd64 and
          # pull armhf from ports.ubuntu.com (see deploy/ubuntu-armhf-ports.sh).
          sudo ./deploy/ubuntu-armhf-ports.sh
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf pkg-config \
            libasound2-dev:armhf libsdl2-dev:armhf libgles2-mesa-dev:armhf \
            libegl1-mesa-dev:armhf libgbm-dev:armhf libdrm-dev:armhf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf

      - name: Cross-build and stage dist/armv7
        env:
          SKIP_APT: "1"
          PACKAGES: midi-engine,jambox-engine,pidi-native
        run: ./deploy/build-pi-bins.sh

      - name: Upload staged binaries
        uses: actions/upload-artifact@v4
        with:
          name: armv7-bins
          path: dist/armv7/
          if-no-files-found: error

      - name: Commit staged binaries to master
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          BUILT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin master
          remote="$(git rev-parse origin/master)"
          if [ "$remote" != "$BUILT_SHA" ]; then
            echo "master moved past $BUILT_SHA (now $remote); skip commit-back"
            echo "the newer run will publish bins for the current tree"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dist/armv7/midi-engine dist/armv7/jambox-engine dist/armv7/pidi-native
          if git diff --staged --quiet; then
            echo "armv7 ELFs match master — nothing to publish"
            exit 0
          fi
          git add dist/armv7/VERSION

          MSG=$(printf '%s\n' \
            "Rebuild Pi armv7 engines from CI." \
            "" \
            "Built from ${BUILT_SHA} so SET→UPDATE can copy" \
            "dist/armv7/{midi-engine,jambox-engine,pidi-native} onto bin/." \
            "" \
            "[skip ci]")
          git commit -m "$MSG"

          if git push origin HEAD:refs/heads/master; then
            echo "published dist/armv7 to master"
            exit 0
          fi

          echo "push rejected — checking why"
          git fetch origin master
          if [ "$(git rev-parse origin/master)" != "$BUILT_SHA" ]; then
            echo "master moved during the build; skip (newer run publishes)"
            exit 0
          fi
          echo "push failed while master is still $BUILT_SHA" >&2
          echo "if branch protection blocks github-actions[bot], allow it to push" >&2
          echo "or grant contents:write / a PAT that can update master" >&2
          exit 1
